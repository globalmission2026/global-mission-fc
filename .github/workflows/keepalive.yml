name: Supabase Keep-Alive

# Runs every 3 days to prevent Supabase free-tier project from being paused
# Supabase pauses free projects after 7 days of inactivity.
on:
  schedule:
    # Every 3 days at 00:00 UTC (well within the 7-day pause window)
    - cron: "0 0 */3 * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    name: Ping Supabase to prevent inactivity pause

    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          echo "Pinging Supabase at $SUPABASE_URL ..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Supabase is awake and responding."
          else
            echo "Unexpected status $HTTP_STATUS - check Supabase dashboard."
            exit 1
          fi
